<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Perfil · Finfortes</title>
<link rel="icon" type="image/x-icon" href="img/icone.ico">
<style>html.finfortes-checking { visibility: hidden; }</style>
<script>document.documentElement.classList.add('finfortes-checking');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --royal: #2451e6;
    --royal-2: #4d78ff;
    --royal-deep: #12308f;
    --cyan: #22b8ee;
    --error: #d43a55;
  }

  /* ---------- TEMA CLARO (padrão) ---------- */
  html[data-theme="light"]{
    --bg-deep: #eef1f9;
    --bg-panel: #ffffff;
    --bg-panel-2: #ffffff;
    --border-soft: rgba(18,30,70,0.09);
    --border-focus: rgba(36,81,230,0.5);
    --text-primary: #10162e;
    --text-secondary: #5c6482;
    --text-tertiary: #98a0bd;
    --input-bg: rgba(18,30,70,0.03);
    --input-bg-focus: rgba(36,81,230,0.06);
    --error-bg: rgba(212,58,85,0.07);
    --error-border: rgba(212,58,85,0.28);
    --warning: #b45309;
    --blob-opacity: 0.35;
    --shadow-card: 0 30px 60px -25px rgba(20,35,90,0.22), 0 1px 0 rgba(255,255,255,0.6) inset;
    --grain-blend: multiply;
  }

  /* ---------- TEMA ESCURO ---------- */
  html[data-theme="dark"]{
    --bg-deep: #0a0e1a;
    --bg-panel: #10152a;
    --bg-panel-2: #141a33;
    --border-soft: rgba(255,255,255,0.08);
    --border-focus: rgba(77,120,255,0.55);
    --text-primary: #f4f5fb;
    --text-secondary: #8b90ac;
    --text-tertiary: #5a5f7a;
    --input-bg: rgba(255,255,255,0.03);
    --input-bg-focus: rgba(36,81,230,0.12);
    --error-bg: rgba(212,58,85,0.12);
    --error-border: rgba(212,58,85,0.4);
    --warning: #facc15;
    --blob-opacity: 0.55;
    --shadow-card: 0 30px 60px -20px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.02) inset, 0 1px 0 rgba(255,255,255,0.06) inset;
    --grain-blend: overlay;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    min-height:100%;
    font-family:'Plus Jakarta Sans', sans-serif;
    background: var(--bg-deep);
    color:var(--text-primary);
    transition: background .35s ease, color .35s ease;
  }

  body{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
  }

  .backdrop{
    position:fixed;
    inset:0;
    z-index:0;
    transition: opacity .35s ease;
  }
  html[data-theme="light"] .backdrop{
    background:
      radial-gradient(1100px 700px at 8% -10%, rgba(36,81,230,0.16), transparent 60%),
      radial-gradient(900px 650px at 100% 0%, rgba(77,120,255,0.10), transparent 55%),
      linear-gradient(160deg, #eef1f9 35%, #eef1f9 100%);
  }
  html[data-theme="dark"] .backdrop{
    background:
      radial-gradient(1100px 700px at 8% -10%, rgba(36,81,230,0.55), transparent 60%),
      radial-gradient(900px 650px at 100% 0%, rgba(18,25,60,0.9), transparent 55%),
      linear-gradient(160deg, #0a0e1a 35%, #0a0e1a 100%);
  }

  .blob{
    position:fixed;
    top:-320px;
    left:-260px;
    width:900px;
    height:900px;
    z-index:0;
    border-radius:50%;
    background: conic-gradient(from 200deg at 50% 50%, var(--royal-deep), var(--royal-2) 22%, var(--cyan) 46%, var(--bg-deep) 65%);
    filter: blur(60px);
    opacity: var(--blob-opacity);
    pointer-events:none;
    transition: opacity .35s ease;
  }

  .grain{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background-image: radial-gradient(rgba(120,130,180,0.05) 1px, transparent 1px);
    background-size: 3px 3px;
    mix-blend-mode: var(--grain-blend);
  }

  /* ---------- TOGGLE DE TEMA ---------- */
  .theme-toggle{
    position:fixed;
    top:24px;
    right:24px;
    z-index:5;
    display:flex;
    align-items:center;
    gap:9px;
    background: var(--bg-panel);
    border:1px solid var(--border-soft);
    border-radius:999px;
    padding:6px 8px;
    box-shadow: var(--shadow-card);
  }

  .theme-toggle .icon{
    width:15px; height:15px;
    color: var(--text-tertiary);
    display:flex;
    transition: color .2s ease;
  }
  .theme-toggle .icon.active{ color: var(--royal); }

  .switch{
    position:relative;
    width:38px;
    height:21px;
    border-radius:999px;
    background: var(--border-soft);
    border:none;
    cursor:pointer;
    padding:0;
    transition: background .25s ease;
  }
  .switch::after{
    content:"";
    position:absolute;
    top:2px; left:2px;
    width:17px; height:17px;
    border-radius:50%;
    background: linear-gradient(135deg, var(--royal), var(--royal-2));
    box-shadow: 0 2px 6px rgba(36,81,230,0.5);
    transition: transform .25s cubic-bezier(.4,0,.2,1);
  }
  html[data-theme="dark"] .switch::after{
    transform: translateX(17px);
  }

  .card{
    position:relative;
    z-index:2;
    width:100%;
    max-width:440px;
    background: linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
    border:1px solid var(--border-soft);
    border-radius:20px;
    padding:40px 36px 32px;
    box-shadow: var(--shadow-card);
    animation: rise .55s cubic-bezier(.2,.9,.25,1) both;
    transition: background .35s ease, box-shadow .35s ease;
  }

  @keyframes rise{
    from{ opacity:0; transform: translateY(14px) scale(.985); }
    to{ opacity:1; transform: translateY(0) scale(1); }
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:32px;
  }

  .brand-mark{
    width:32px; height:32px;
    border-radius:9px;
    background: conic-gradient(from 45deg, var(--royal), var(--royal-2), var(--cyan));
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 6px 16px -4px rgba(36,81,230,0.55);
    flex-shrink:0;
  }
  .brand-mark svg{ width:16px; height:16px; }

  .brand-name{
    font-weight:700;
    font-size:15px;
    letter-spacing:0.2px;
  }

  h1{
    font-size:22px;
    font-weight:700;
    letter-spacing:-0.3px;
    margin-bottom:6px;
    text-align:left;
  }

  .subtitle{
    color:var(--text-secondary);
    font-size:13.5px;
    line-height:1.5;
    margin-bottom:28px;
    text-align:left;
  }

  form{ display:flex; flex-direction:column; gap:18px; }

  .field-label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--text-secondary);
    margin-bottom:8px;
    letter-spacing:0.2px;
  }

  .input-wrap{
    position:relative;
    display:flex;
    align-items:center;
  }

  .input-wrap svg{
    position:absolute;
    left:14px;
    width:17px; height:17px;
    color:var(--text-tertiary);
    pointer-events:none;
    transition: color .2s ease;
  }

  input[type="email"],
  input[type="text"]{
    width:100%;
    background: var(--input-bg);
    border:1px solid var(--border-soft);
    border-radius:11px;
    padding:13px 14px 13px 42px;
    font-size:14px;
    font-family:inherit;
    color:var(--text-primary);
    outline:none;
    transition: border-color .2s ease, background .2s ease, box-shadow .2s ease;
  }

  input[type="email"]::placeholder,
  input[type="text"]::placeholder{ color:var(--text-tertiary); }

  input[type="email"]:hover,
  input[type="text"]:hover{
    border-color: rgba(36,81,230,0.28);
  }

  input[type="email"]:focus,
  input[type="text"]:focus{
    border-color: var(--border-focus);
    background: var(--input-bg-focus);
    box-shadow: 0 0 0 4px rgba(36,81,230,0.14);
  }

  .input-wrap:focus-within svg{ color: var(--royal); }

  select{
    width:100%;
    background: var(--input-bg);
    border:1px solid var(--border-soft);
    border-radius:11px;
    padding:13px 14px 13px 42px;
    font-size:14px;
    font-family:inherit;
    color:var(--text-primary);
    outline:none;
    appearance:none;
    cursor:pointer;
    transition: border-color .2s ease, background .2s ease, box-shadow .2s ease;
  }
  select:hover{ border-color: rgba(36,81,230,0.28); }
  select:focus{
    border-color: var(--border-focus);
    background: var(--input-bg-focus);
    box-shadow: 0 0 0 4px rgba(36,81,230,0.14);
  }

  .nome-wrapper input[type="text"]{ padding-right:34px; }

  #btnSeta{
    position:absolute;
    right:8px;
    width:26px; height:26px;
    border-radius:7px;
    background:none;
    border:none;
    color:var(--text-tertiary);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: color .2s ease, background .2s ease;
  }
  #btnSeta:hover{ color:var(--royal); background:var(--input-bg-focus); }
  #btnSeta svg{ width:14px; height:14px; }

  .dropdown-lista{
    position:absolute;
    top:calc(100% + 6px);
    left:0;
    right:0;
    background: var(--bg-panel);
    border:1px solid var(--border-soft);
    border-radius:11px;
    max-height:180px;
    overflow-y:auto;
    z-index:10;
    display:none;
    box-shadow: var(--shadow-card);
  }
  .dropdown-item{
    padding:9px 12px;
    cursor:pointer;
    font-size:13.5px;
    color:var(--text-primary);
    transition: background .15s ease;
  }
  .dropdown-item:hover{ background: var(--input-bg-focus); }

  .un-list{
    max-height:170px;
    overflow-y:auto;
    background: var(--input-bg);
    border:1px solid var(--border-soft);
    border-radius:11px;
    padding:10px 14px;
    font-size:13.5px;
    color:var(--text-tertiary);
  }
  .un-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:6px 0;
    color:var(--text-primary);
    font-size:13.5px;
  }
  .un-item input.un-checkbox{
    width:16px; height:16px;
    flex-shrink:0;
    accent-color: var(--royal);
    cursor:pointer;
  }

  #modoEdicaoAviso{
    font-size:12.5px;
    font-weight:600;
    color: var(--warning);
    text-align:center;
    margin-top:-8px;
    display:none;
  }

  .submit-btn{
    width:100%;
    border:none;
    border-radius:11px;
    padding:13.5px 16px;
    font-family:inherit;
    font-size:14.5px;
    font-weight:700;
    color:#fff;
    cursor:pointer;
    background: linear-gradient(135deg, var(--royal), var(--royal-deep) 55%, var(--royal-2));
    box-shadow: 0 12px 24px -8px rgba(36,81,230,0.5);
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
  }
  .submit-btn:hover{
    filter:brightness(1.08);
    box-shadow: 0 16px 28px -8px rgba(36,81,230,0.65);
  }
  .submit-btn:active{ transform: translateY(1px) scale(.995); }

  .secondary-btn{
    width:100%;
    border:1px solid var(--border-soft);
    border-radius:11px;
    padding:12px 16px;
    font-family:inherit;
    font-size:13.5px;
    font-weight:600;
    color:var(--text-secondary);
    background: var(--input-bg);
    cursor:pointer;
    display:none;
    transition: background .2s ease, color .2s ease, border-color .2s ease;
  }
  .secondary-btn:hover{
    background: var(--input-bg-focus);
    color:var(--text-primary);
    border-color: var(--border-focus);
  }

  #status{
    text-align:center;
    font-size:13px;
    font-weight:600;
    min-height:16px;
    transition: color .2s ease;
  }

  @media (max-width: 420px){
    .card{ padding:32px 24px 26px; border-radius:16px; }
    .theme-toggle{ top:16px; right:16px; }
  }
</style>
</head>
<body>

  <div class="backdrop"></div>
  <div class="blob"></div>
  <div class="grain"></div>

  <div class="theme-toggle">
    <span class="icon" id="sunIcon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </span>
    <button class="switch" id="themeSwitch" aria-label="Alternar tema"></button>
    <span class="icon" id="moonIcon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
    </span>
  </div>

  <div class="card">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 12L10 18L20 6" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <span class="brand-name">Finfortes</span>
    </div>

    <h1>Cadastro de Perfil</h1>
    <p class="subtitle">Gerencie os perfis de acesso e as unidades vinculadas.</p>

    <form id="formPerfil" novalidate>
      <div>
        <label class="field-label" for="nome">Nome</label>
        <div class="input-wrap nome-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 12a4 4 0 100-8 4 4 0 000 8z"/><path d="M4 20c0-3.5 3.5-6 8-6s8 2.5 8 6"/>
          </svg>
          <input type="text" id="nome" placeholder="Nome" autocomplete="off" required>
          <button type="button" id="btnSeta">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="dropdown-lista" id="dropdownLista"></div>
        </div>
      </div>

      <div>
        <label class="field-label" for="email">E-mail</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 6h16v12H4z"/><path d="M4 7l8 6 8-6"/>
          </svg>
          <input type="email" id="email" placeholder="email@fortes.ind.br" required>
        </div>
      </div>

      <div>
        <label class="field-label" for="hierarquia">Departamento</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12h18"/><path d="M3 6h18"/><path d="M3 18h18"/>
          </svg>
          <select id="hierarquia">
            <option value="">Carregando...</option>
          </select>
        </div>
      </div>

      <div>
        <label class="field-label" for="unList">Selecione as UNs</label>
        <div class="un-list" id="unList">Carregando...</div>
      </div>

      <div id="modoEdicaoAviso">Editando cadastro existente</div>

      <button type="submit" class="submit-btn" id="btnSalvar">Salvar</button>
      <button type="button" class="secondary-btn" id="btnNovo">Cancelar edicao / Novo cadastro</button>
      <div id="status"></div>
    </form>
  </div>

<script>
  // Tema: sempre inicia em claro (light), independente de escolha anterior
  const root = document.documentElement;
  const themeSwitch = document.getElementById('themeSwitch');
  const sunIcon = document.getElementById('sunIcon');
  const moonIcon = document.getElementById('moonIcon');

  function applyIcons(theme){
    sunIcon.classList.toggle('active', theme === 'light');
    moonIcon.classList.toggle('active', theme === 'dark');
  }
  applyIcons('light');

  themeSwitch.addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    root.setAttribute('data-theme', next);
    applyIcons(next);
  });

  const SUPABASE_URL = "https://skvayfwuaelxxnhctlhv.supabase.co";
  const SUPABASE_KEY = "sb_publishable_io0L_HpoZeWfh4jlQvBN-Q_R2N9cBwb";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let perfisExistentes = [];
  let emailEmEdicao = null;

  function formatarUN(un) {
    if (un === 7) return "(Sede)";
    const str = String(un).padStart(6, '0');
    return str.slice(0, 4) + '-' + str.slice(4);
  }

  async function carregarUNs() {
    const unListDiv = document.getElementById('unList');
    const { data, error } = await supabaseClient.rpc('get_uns_distintas');

    if (error) {
      console.error(error);
      unListDiv.textContent = "Erro ao carregar UNs: " + error.message;
      return;
    }

    if (!data || data.length === 0) {
      unListDiv.textContent = "Nenhuma UN encontrada.";
      return;
    }

    unListDiv.innerHTML = data.map(row => `
      <div class="un-item">
        <input type="checkbox" value="${row.un}" class="un-checkbox">
        <span>${formatarUN(row.un)}</span>
      </div>
    `).join('');
  }

  async function carregarHierarquias() {
    const selectHierarquia = document.getElementById('hierarquia');
    const { data, error } = await supabaseClient
      .from('Perfil')
      .select('hierarquia')
      .not('hierarquia', 'is', null);

    if (error) {
      console.error(error);
      selectHierarquia.innerHTML = '<option value="">Erro ao carregar</option>';
      return;
    }

    const valores = [...new Set((data || []).map(row => row.hierarquia).filter(Boolean))].sort();
    const escapeHtml = (str) => str.replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

    selectHierarquia.innerHTML = '<option value="">Selecione...</option>' +
      valores.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');
  }

  async function carregarPerfisExistentes() {
    const { data, error } = await supabaseClient
      .from('Perfil')
      .select('nome, email, un, hierarquia')
      .order('nome');

    if (error) {
      console.error("Erro ao carregar perfis:", error);
      return;
    }

    perfisExistentes = data || [];
  }

  function marcarCheckboxesDaPessoa(unsDaPessoa) {
    document.querySelectorAll('.un-checkbox').forEach(cb => {
      cb.checked = (unsDaPessoa || []).includes(parseInt(cb.value));
    });
  }

  function entrarEmModoEdicao(perfil) {
    emailEmEdicao = perfil.email;
    document.getElementById('email').value = perfil.email;
    document.getElementById('hierarquia').value = perfil.hierarquia || '';
    marcarCheckboxesDaPessoa(perfil.un);
    document.getElementById('modoEdicaoAviso').style.display = 'block';
    document.getElementById('btnNovo').style.display = 'block';
    document.getElementById('btnSalvar').textContent = 'Salvar alteracoes';
  }

  function sairDoModoEdicao() {
    emailEmEdicao = null;
    document.getElementById('formPerfil').reset();
    document.getElementById('hierarquia').value = '';
    document.querySelectorAll('.un-checkbox').forEach(cb => cb.checked = false);
    document.getElementById('modoEdicaoAviso').style.display = 'none';
    document.getElementById('btnNovo').style.display = 'none';
    document.getElementById('btnSalvar').textContent = 'Salvar';
  }

  document.getElementById('btnNovo').addEventListener('click', sairDoModoEdicao);

  const inputNome = document.getElementById('nome');
  const dropdown = document.getElementById('dropdownLista');

  function renderizarDropdown(lista) {
    if (lista.length === 0) {
      dropdown.innerHTML = '<div class="dropdown-item" style="opacity:0.6;cursor:default;">Nenhum cadastro encontrado</div>';
      dropdown.style.display = 'block';
      return;
    }

    dropdown.innerHTML = lista.map(p => `
      <div class="dropdown-item" data-email="${p.email}">${p.nome} - ${p.email}</div>
    `).join('');
    dropdown.style.display = 'block';

    dropdown.querySelectorAll('.dropdown-item[data-email]').forEach(item => {
      item.addEventListener('click', () => {
        const emailSelecionado = item.getAttribute('data-email');
        const perfil = perfisExistentes.find(p => p.email === emailSelecionado);
        inputNome.value = perfil.nome;
        entrarEmModoEdicao(perfil);
        dropdown.style.display = 'none';
      });
    });
  }

  const btnSeta = document.getElementById('btnSeta');

  btnSeta.addEventListener('click', () => {
    if (dropdown.style.display === 'block') {
      dropdown.style.display = 'none';
      return;
    }
    const termo = inputNome.value.trim().toLowerCase();
    const filtrados = termo
      ? perfisExistentes.filter(p => p.nome && p.nome.toLowerCase().includes(termo))
      : perfisExistentes;
    renderizarDropdown(filtrados);
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.nome-wrapper')) {
      dropdown.style.display = 'none';
    }
  });

  // Guarda de acesso: só entra quem foi confirmado como admin (is_admin = true) em /login.
  async function verificarAcessoAdmin() {
    const emailAdmin = sessionStorage.getItem('finfortes_admin_email');
    if (!emailAdmin) {
      window.location.replace('/login');
      return false;
    }

    const { data, error } = await supabaseClient
      .from('Perfil')
      .select('is_admin')
      .ilike('email', emailAdmin)
      .maybeSingle();

    if (error || !data || data.is_admin !== true) {
      sessionStorage.removeItem('finfortes_admin_email');
      window.location.replace('/login');
      return false;
    }

    document.documentElement.classList.remove('finfortes-checking');
    return true;
  }

  async function iniciar() {
    const autorizado = await verificarAcessoAdmin();
    if (!autorizado) return;
    await carregarUNs();
    await carregarHierarquias();
    await carregarPerfisExistentes();
  }
  iniciar();

  document.getElementById('formPerfil').addEventListener('submit', async (e) => {
    e.preventDefault();

    const nome = document.getElementById('nome').value;
    const email = document.getElementById('email').value;
    const hierarquia = document.getElementById('hierarquia').value || null;
    const un = Array.from(document.querySelectorAll('.un-checkbox:checked'))
      .map(cb => parseInt(cb.value));
    const status = document.getElementById('status');

    if (un.length === 0) {
      status.textContent = "Selecione ao menos uma UN.";
      status.style.color = "var(--error)";
      return;
    }

    status.textContent = "Enviando...";
    status.style.color = "var(--text-secondary)";

    let resultado;
    if (emailEmEdicao) {
      resultado = await supabaseClient
        .from('Perfil')
        .update({ nome, email, un, hierarquia })
        .eq('email', emailEmEdicao);
    } else {
      resultado = await supabaseClient
        .from('Perfil')
        .insert([{ nome, email, un, hierarquia }]);
    }

    const { error } = resultado;

    if (error) {
      console.error(error);
      status.textContent = "Erro ao salvar: " + error.message;
      status.style.color = "var(--error)";
    } else {
      status.textContent = "Salvo com sucesso!";
      status.style.color = "#22c55e";
      sairDoModoEdicao();
      await carregarPerfisExistentes();
    }
  });
</script>
