<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finfortes · Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-deep: #060D1A;
    --navy: #0B1830;
    --navy-soft: #13234A;
    --brand: #2E7DF5;
    --brand-2: #22D3C5;
    --brand-soft: rgba(46, 125, 245, 0.12);
    --bg: radial-gradient(1100px 700px at 15% -10%, #0F2549 0%, transparent 60%),
          radial-gradient(900px 600px at 110% 110%, #0B2E3E 0%, transparent 55%),
          var(--navy-deep);
    --surface: rgba(255, 255, 255, 0.035);
    --surface-solid: #0E1B36;
    --ink: #EEF2FB;
    --ink-soft: #8A93AD;
    --line: rgba(255, 255, 255, 0.09);
    --error: #FF6B6B;
    --error-bg: rgba(255, 107, 107, 0.12);
    --success: #34D399;
    --success-bg: rgba(52, 211, 153, 0.12);
    --radius: 16px;
    --shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.7);
  }
  html[data-theme="light"] {
    --bg: radial-gradient(1200px 800px at 20% -10%, #EAF1FF 0%, transparent 60%), #F5F7FB;
    --surface: #FFFFFF;
    --surface-solid: #FFFFFF;
    --ink: #10142A;
    --ink-soft: #626A82;
    --line: #E3E7F0;
    --error: #C4372C;
    --error-bg: #FDECEA;
    --success: #17804F;
    --success-bg: #E7F7EF;
    --shadow: 0 30px 80px -30px rgba(20, 30, 60, 0.25);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    transition: background .3s ease, color .3s ease;
  }

  .mark {
    width: 40px;
    height: 40px;
    margin: 0 auto 22px;
    position: relative;
  }
  .mark svg { width: 100%; height: 100%; display: block; }

  .card {
    width: 100%;
    max-width: 372px;
    background: var(--surface-solid);
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 40px 36px 32px;
    position: relative;
  }
  html[data-theme="dark"] .card {
    background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
    backdrop-filter: blur(20px);
  }

  .theme-toggle {
    position: absolute;
    top: 18px; right: 18px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-soft);
    width: 32px; height: 32px;
    border-radius: 9px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .theme-toggle:hover { border-color: var(--brand); color: var(--brand); }

  .card-head { text-align: center; margin-bottom: 30px; }
  .card-head h1 {
    font-size: 19px;
    font-weight: 600;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  .card-head p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 13.5px;
  }

  label {
    display: block;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink-soft);
    margin-bottom: 7px;
  }
  .email-field {
    display: flex;
    align-items: stretch;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: rgba(255,255,255,0.02);
    overflow: hidden;
    transition: border-color .15s ease, background .15s ease;
  }
  html[data-theme="light"] .email-field { background: #FAFBFE; }
  .email-field:focus-within { border-color: var(--brand); }
  .email-field input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    color: var(--ink);
    font-size: 15px;
    padding: 13px 4px 13px 14px;
    font-family: 'Inter', sans-serif;
  }
  .email-suffix {
    display: flex;
    align-items: center;
    padding: 0 14px 0 6px;
    color: var(--ink-soft);
    font-size: 14px;
    font-family: 'IBM Plex Mono', monospace;
    background: rgba(255,255,255,0.03);
    border-left: 1px solid var(--line);
    white-space: nowrap;
  }
  html[data-theme="light"] .email-suffix { background: #F0F2F8; }
  .hint {
    font-size: 12px;
    color: var(--ink-soft);
    margin: 9px 0 0;
    line-height: 1.5;
  }
  button.submit {
    width: 100%;
    margin-top: 22px;
    padding: 13px;
    border: none;
    border-radius: 11px;
    background: linear-gradient(135deg, var(--brand), var(--brand-2));
    color: #fff;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    transition: filter .15s ease, transform .05s ease;
  }
  button.submit:hover { filter: brightness(1.08); }
  button.submit:active { transform: scale(0.99); }
  button.submit:disabled { opacity: 0.5; cursor: not-allowed; }

  .status {
    margin-top: 16px;
    padding: 11px 13px;
    border-radius: 10px;
    font-size: 13px;
    display: none;
    align-items: flex-start;
    gap: 8px;
    line-height: 1.4;
  }
  .status.show { display: flex; }
  .status.error { background: var(--error-bg); color: var(--error); }
  .status.success { background: var(--success-bg); color: var(--success); }
  .status.info { background: var(--brand-soft); color: var(--brand); }

  /* ---- Etapa OTP ---- */
  .step { display: none; }
  .step.active { display: block; }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: none;
    border: none;
    padding: 0;
    color: var(--ink-soft);
    font-size: 12.5px;
    cursor: pointer;
    margin-bottom: 16px;
  }
  .back-link:hover { color: var(--brand); }
  .otp-target {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--ink);
    font-weight: 500;
  }
  .otp-boxes {
    display: flex;
    gap: 8px;
    margin-top: 6px;
  }
  .otp-boxes input {
    width: 100%;
    aspect-ratio: 1;
    text-align: center;
    font-size: 19px;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: rgba(255,255,255,0.02);
    color: var(--ink);
    outline: none;
    transition: border-color .15s ease;
  }
  html[data-theme="light"] .otp-boxes input { background: #FAFBFE; }
  .otp-boxes input:focus { border-color: var(--brand); }
  .resend-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .resend-link {
    background: none;
    border: none;
    color: var(--brand);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    padding: 0;
  }
  .resend-link:disabled { color: var(--ink-soft); cursor: not-allowed; }
</style>
</head>
<body>

  <div class="card">
    <button class="theme-toggle" id="themeToggle" type="button" title="Alternar tema">◐</button>

    <div class="mark">
      <svg viewBox="0 0 40 40" fill="none">
        <path d="M20 2 L36 11 V29 L20 38 L4 29 V11 Z" stroke="url(#markGrad)" stroke-width="1.6"/>
        <path d="M20 12 L28 16.5 V25.5 L20 30 L12 25.5 V16.5 Z" fill="url(#markGrad)" fill-opacity="0.18"/>
        <path d="M14 20 L19 23 L27 15" stroke="url(#markGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <defs>
          <linearGradient id="markGrad" x1="4" y1="2" x2="36" y2="38" gradientUnits="userSpaceOnUse">
            <stop stop-color="#2E7DF5"/>
            <stop offset="1" stop-color="#22D3C5"/>
          </linearGradient>
        </defs>
      </svg>
    </div>

    <div class="card-head">
      <h1>Entrar no Finfortes</h1>
      <p>Use seu e-mail corporativo Fortes</p>
    </div>

    <div class="step active" id="stepEmail">
      <form id="loginForm" novalidate>
        <label for="emailLocal">E-mail</label>
        <div class="email-field">
          <input type="text" id="emailLocal" placeholder="nome.sobrenome" autocomplete="username" autocapitalize="off" spellcheck="false" required>
          <span class="email-suffix">@fortes.ind.br</span>
        </div>
        <p class="hint">Apenas e-mails @fortes.ind.br têm acesso ao Finfortes.</p>

        <button type="submit" class="submit" id="submitBtn">Verificar acesso</button>
      </form>
    </div>

    <div class="step" id="stepOtp">
        <button type="button" class="back-link" id="backBtn">← Trocar e-mail</button>
        <p class="hint" style="margin-bottom:14px;">Enviamos um código para <span class="otp-target" id="otpTarget"></span></p>

        <form id="otpForm" novalidate>
          <label>Código de acesso</label>
          <div class="otp-boxes" id="otpBoxes">
            <input type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code">
            <input type="text" inputmode="numeric" maxlength="1">
            <input type="text" inputmode="numeric" maxlength="1">
            <input type="text" inputmode="numeric" maxlength="1">
            <input type="text" inputmode="numeric" maxlength="1">
            <input type="text" inputmode="numeric" maxlength="1">
          </div>
          <button type="submit" class="submit" id="verifyBtn">Entrar</button>
        </form>

        <div class="resend-row">
          <span>Não recebeu?</span>
          <button type="button" class="resend-link" id="resendBtn">Reenviar código</button>
        </div>
      </div>

      <div class="status" id="status"></div>
    </div>
  </section>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = "https://skvayfwuaelxxnhctlhv.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_io0L_HpoZeWfh4jlQvBN-Q_R2N9cBwb";
    const DOMAIN = "@fortes.ind.br";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('loginForm');
    const emailLocal = document.getElementById('emailLocal');
    const submitBtn = document.getElementById('submitBtn');
    const statusBox = document.getElementById('status');

    const stepEmail = document.getElementById('stepEmail');
    const stepOtp = document.getElementById('stepOtp');
    const otpTarget = document.getElementById('otpTarget');
    const otpForm = document.getElementById('otpForm');
    const otpBoxes = [...document.querySelectorAll('#otpBoxes input')];
    const verifyBtn = document.getElementById('verifyBtn');
    const backBtn = document.getElementById('backBtn');
    const resendBtn = document.getElementById('resendBtn');

    let currentEmail = '';
    let resendTimer = null;

    function setStatus(kind, message) {
      statusBox.className = 'status show ' + kind;
      statusBox.textContent = message;
    }
    function clearStatus() {
      statusBox.className = 'status';
      statusBox.textContent = '';
    }

    function goToOtpStep(email) {
      currentEmail = email;
      otpTarget.textContent = email;
      stepEmail.classList.remove('active');
      stepOtp.classList.add('active');
      otpBoxes.forEach(b => b.value = '');
      otpBoxes[0].focus();
      startResendCooldown();
    }

    function goToEmailStep() {
      stepOtp.classList.remove('active');
      stepEmail.classList.add('active');
      clearStatus();
      if (resendTimer) clearInterval(resendTimer);
    }

    function startResendCooldown(seconds = 30) {
      let remaining = seconds;
      resendBtn.disabled = true;
      resendBtn.textContent = `Reenviar código (${remaining}s)`;
      if (resendTimer) clearInterval(resendTimer);
      resendTimer = setInterval(() => {
        remaining -= 1;
        if (remaining <= 0) {
          clearInterval(resendTimer);
          resendBtn.disabled = false;
          resendBtn.textContent = 'Reenviar código';
        } else {
          resendBtn.textContent = `Reenviar código (${remaining}s)`;
        }
      }, 1000);
    }

    async function sendOtp(email) {
      const { error } = await supabase.auth.signInWithOtp({ email });
      return error;
    }

    // Bloqueia qualquer tentativa de digitar "@algumacoisa" no campo — só o nome de usuário é editável
    emailLocal.addEventListener('input', () => {
      emailLocal.value = emailLocal.value.replace(/[@\s]/g, '');
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearStatus();

      const local = emailLocal.value.trim();
      if (!local) {
        setStatus('error', 'Digite seu nome de usuário corporativo.');
        return;
      }

      const email = (local + DOMAIN).toLowerCase();

      submitBtn.disabled = true;
      submitBtn.textContent = 'Verificando...';

      try {
        const { data, error } = await supabase
          .from('Perfil')
          .select('nome, email')
          .ilike('email', email)
          .maybeSingle();

        if (error) {
          console.error(error);
          setStatus('error', 'Não foi possível verificar o e-mail agora. Tente novamente em instantes.');
        } else if (data) {
          setStatus('info', `Enviando código para ${data.nome.split(' ')[0]}...`);
          const otpError = await sendOtp(email);
          if (otpError) {
            console.error(otpError);
            setStatus('error', 'E-mail cadastrado, mas não foi possível enviar o código agora.');
          } else {
            goToOtpStep(email);
          }
        } else {
          setStatus('error', 'Este e-mail não está cadastrado no Finfortes. Fale com o financeiro.');
        }
      } catch (err) {
        console.error(err);
        setStatus('error', 'Falha de conexão com o Supabase.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Verificar acesso';
      }
    });

    // Navegação entre as caixas do código (auto-avança e aceita colar o código inteiro)
    otpBoxes.forEach((box, i) => {
      box.addEventListener('input', () => {
        box.value = box.value.replace(/\D/g, '').slice(0, 1);
        if (box.value && i < otpBoxes.length - 1) otpBoxes[i + 1].focus();
      });
      box.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !box.value && i > 0) otpBoxes[i - 1].focus();
      });
      box.addEventListener('paste', (e) => {
        const pasted = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6);
        if (pasted.length > 1) {
          e.preventDefault();
          pasted.split('').forEach((digit, idx) => { if (otpBoxes[idx]) otpBoxes[idx].value = digit; });
          otpBoxes[Math.min(pasted.length, otpBoxes.length) - 1].focus();
        }
      });
    });

    backBtn.addEventListener('click', goToEmailStep);

    resendBtn.addEventListener('click', async () => {
      if (resendBtn.disabled) return;
      clearStatus();
      resendBtn.disabled = true;
      const error = await sendOtp(currentEmail);
      if (error) {
        console.error(error);
        setStatus('error', 'Não foi possível reenviar agora. Tente de novo em instantes.');
        resendBtn.disabled = false;
      } else {
        setStatus('success', 'Novo código enviado.');
        startResendCooldown();
      }
    });

    otpForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearStatus();

      const token = otpBoxes.map(b => b.value).join('');
      if (token.length < 6) {
        setStatus('error', 'Digite os 6 dígitos do código.');
        return;
      }

      verifyBtn.disabled = true;
      verifyBtn.textContent = 'Entrando...';

      try {
        const { data, error } = await supabase.auth.verifyOtp({
          email: currentEmail,
          token,
          type: 'email'
        });

        if (error) {
          console.error(error);
          setStatus('error', 'Código inválido ou expirado. Tente novamente ou reenvie.');
        } else {
          setStatus('success', 'Acesso confirmado! Entrando...');
          window.location.href = '/';
        }
      } catch (err) {
        console.error(err);
        setStatus('error', 'Falha de conexão com o Supabase.');
      } finally {
        verifyBtn.disabled = false;
        verifyBtn.textContent = 'Entrar';
      }
    });

    // Tema claro/escuro
    const html = document.documentElement;
    const toggle = document.getElementById('themeToggle');
    toggle.addEventListener('click', () => {
      const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      toggle.textContent = next === 'dark' ? '◑' : '◐';
    });
  </script>
</body>
</html>
